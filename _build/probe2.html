<!DOCTYPE html><meta charset="utf-8"><pre id="o">pending</pre>
<script>
const f=document.createElement('iframe');f.style.cssText='width:390px;height:1400px;border:0';f.src='../club-preview.html';document.body.appendChild(f);
f.onload=()=>setTimeout(()=>{const d=f.contentDocument,w=f.contentWindow;const rv=d.querySelector('.cstats .rv'),cs=d.querySelector('.cstats');
if(!rv){document.getElementById('o').textContent='no .rv';return;}
const r=rv.getBoundingClientRect(),c=w.getComputedStyle(rv),cc=w.getComputedStyle(cs);
document.getElementById('o').textContent=['rv rect='+JSON.stringify({x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}),'rv display='+c.display+' vis='+c.visibility+' color='+c.color+' font='+c.fontSize,'cstats display='+cc.display+' width='+Math.round(cs.getBoundingClientRect().width),'cstats children='+cs.children.length,'text='+JSON.stringify(rv.textContent.trim())].join('\n');},3500);
</script>
