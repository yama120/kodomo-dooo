<!DOCTYPE html><meta charset="utf-8"><style>html,body{margin:0}iframe{display:block;border:0;width:1440px;height:1000px}</style>
<script>const q=new URLSearchParams(location.search),p=q.get('p'),y=+(q.get('y')||0);document.write('<iframe id="f" src="../'+p+'"></iframe>');
addEventListener('load',function(){var f=document.getElementById('f');function go(){try{f.contentWindow.scrollTo(0,y);f.contentWindow.dispatchEvent(new Event('scroll'))}catch(e){}}go();setTimeout(go,300);setTimeout(go,900)})</script>
