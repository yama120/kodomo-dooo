<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>クラブ分析｜チビスポ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Anton&display=swap">
<style>
:root{--ink:#1f2430;--sub:#54606e;--mute:#8a93a0;--line:#e5e8ec;--bg:#fff;--alt:#f6f7f9;--accent:#E43B4D;--accent-bg:#fdecee;
  --blue:#2a6fdb;--green:#1f8a5b;--amber:#d98a1a;--violet:#6b5bd2;--r:10px;--f:'Zen Kaku Gothic New',system-ui,-apple-system,"Hiragino Sans",sans-serif;--en:'Anton',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.6;font-weight:500;padding-bottom:96px}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.ey{font-family:var(--en);font-size:11px;letter-spacing:.24em;color:var(--accent);display:flex;align-items:center;gap:10px}
.ey::before{content:"";width:18px;height:2px;background:var(--accent)}
h2{font-size:17px;font-weight:900;line-height:1.4;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--sub);font-weight:700}
.num{font-variant-numeric:tabular-nums}
/* header */
.hd{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd .row{display:flex;align-items:center;justify-content:space-between;height:56px;gap:10px}
.hd .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.hd .brand img{height:24px;width:auto;display:block}
.hd .brand b{font-size:13px;font-weight:900;letter-spacing:.02em}
.hd .club{display:flex;align-items:center;gap:8px;min-width:0}
.hd .club .nm{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.plan{font-family:var(--en);font-size:10px;letter-spacing:.16em;padding:3px 8px 2px;border:1.5px solid var(--ink);border-radius:999px;white-space:nowrap}
.plan.pro{background:var(--ink);color:#fff}
.gear{width:38px;height:38px;border:1.5px solid var(--line);background:#fff;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none}
.gear svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-width:96px;background:transparent;border:0;border-bottom:3px solid transparent;padding:10px 6px 9px;font-size:13.5px;font-weight:900;color:var(--mute);letter-spacing:.02em}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button small{display:block;font-family:var(--en);font-size:9px;letter-spacing:.2em;color:var(--mute);font-weight:400;margin-top:1px}
/* notice bars */
.bar{font-size:12.5px;font-weight:700;padding:10px 16px;text-align:center}
.bar.demo{background:#fff6d6;color:#6b5500}
.bar.warn{background:var(--accent-bg);color:#9b1c2c}
.bar.ok{background:#e8f6ee;color:#155f3f}
/* sections */
.pane{display:none;padding:18px 0 10px}.pane.on{display:block}
section{margin:0 0 26px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sh .l{display:flex;flex-direction:column;gap:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card{margin-top:10px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr}
.g4{grid-template-columns:1fr 1fr}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}h2{font-size:19px}}
@media(max-width:759px){.kpi .win{display:none}.kpi .v{font-size:27px}}
/* KPI */
.kpi .lb{font-size:12px;font-weight:800;color:var(--sub);display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi .v{font-size:30px;font-weight:900;line-height:1.1;margin:8px 0 4px;letter-spacing:-.02em}
.kpi .v small{font-size:13px;font-weight:800;color:var(--sub);margin-left:4px;letter-spacing:0}
.kpi .d{font-size:11.5px;font-weight:700;color:var(--mute)}
.kpi .d b{color:var(--ink)}
.kpi .d .up{color:var(--green)}.kpi .d .dn{color:var(--accent)}
.kpi svg{display:block;width:100%;height:34px;margin-top:8px}
.kpi .win{font-family:var(--en);font-size:9.5px;letter-spacing:.18em;color:var(--mute);font-weight:400}
.pbar{height:6px;background:var(--alt);border-radius:999px;overflow:hidden;margin-top:10px}.pbar i{display:block;height:100%;background:var(--accent)}
.ed{border:1px solid var(--line);background:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:3px 9px;color:var(--sub)}
/* 今週の一手 */
.move{border:1.5px solid var(--ink);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.move .k{font-family:var(--en);font-size:11px;letter-spacing:.24em;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.move h3{font-size:18px;font-weight:900;line-height:1.4;margin-bottom:8px}
.move p{font-size:13px;color:var(--sub);font-weight:700;line-height:1.75}
.move .why{margin-top:10px;font-size:12px;font-weight:700;padding:8px 12px;background:var(--alt);border-radius:8px}
.move .more{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.move .alt{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.move.open .alt{display:block}
.alt .it{padding:8px 0;border-bottom:1px solid var(--line)}.alt .it:last-child{border-bottom:0}
.alt .it b{display:block;font-size:14px}.alt .it span{font-size:12.5px;color:var(--sub);font-weight:700}
.tag{display:inline-block;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--ink);color:#fff;letter-spacing:.04em}
.tag.p2{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}.tag.p3{background:var(--alt);color:var(--sub)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:900;text-decoration:none;white-space:nowrap}
.btn.o{background:#fff;color:var(--ink)}.btn.a{background:var(--accent);border-color:var(--accent)}.btn.s{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.rev{border-left:3px solid var(--accent);padding:12px 14px;background:#fff;border:1px solid var(--line);border-left-width:3px;border-radius:var(--r);font-size:13.5px;font-weight:700;line-height:1.8}
.rev b{color:var(--accent);font-size:17px;margin:0 2px}
.rev small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
/* funnel */
.fn .st{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.fn .st:last-of-type{border-bottom:0}
.fn .nm{font-size:13.5px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fn .src{font-family:var(--en);font-size:9px;letter-spacing:.14em;padding:2px 6px 1px;border:1px solid var(--line);border-radius:4px;color:var(--mute);font-weight:400}
.fn .bar2{grid-column:1/-1;height:10px;background:var(--alt);border-radius:999px;overflow:hidden}.fn .bar2 i{display:block;height:100%;background:var(--ink)}
.fn .val{font-size:17px;font-weight:900;text-align:right;white-space:nowrap}
.fn .rt{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
.fn .rt.ok{background:#e8f6ee;color:#155f3f}.fn .rt.ng{background:var(--accent-bg);color:#9b1c2c}.fn .rt.na{background:var(--alt);color:var(--mute)}
.bn{margin-top:14px;border:1.5px solid var(--accent);border-radius:var(--r);padding:14px;background:#fff}
.bn .k{font-family:var(--en);font-size:10px;letter-spacing:.22em;color:var(--accent)}
.bn h3{font-size:15px;font-weight:900;margin:4px 0 6px}.bn p{font-size:12.5px;color:var(--sub);font-weight:700;line-height:1.75}
/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-family:var(--en);font-weight:400;font-size:10px;letter-spacing:.18em;color:var(--mute);text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
table.t td.w{white-space:normal;min-width:180px}
table.t .n{text-align:right;font-weight:900}
.mb{height:6px;background:var(--alt);border-radius:999px;min-width:70px;overflow:hidden}.mb i{display:block;height:100%;background:var(--ink)}
.chip{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:middle}
.kind{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:4px;background:var(--alt);color:var(--sub)}
.link{color:var(--accent);font-weight:900;font-size:12.5px;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}
.empty{padding:22px 14px;text-align:center;color:var(--mute);font-weight:700;font-size:13px;line-height:1.8;background:var(--alt);border-radius:8px}
.lock{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px 16px;background:var(--alt)}
.lock .k{font-family:var(--en);font-size:10px;letter-spacing:.22em;color:var(--mute);display:flex;align-items:center;gap:6px}
.lock h3{font-size:15px;font-weight:900;margin:6px 0 6px}.lock p{font-size:12.5px;color:var(--sub);font-weight:700;line-height:1.75;margin-bottom:12px}
/* posts */
.conn{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.conn .c{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.conn .c b{font-size:13px}.conn .c .st{font-size:11.5px;font-weight:800;color:var(--mute)}.conn .c .st.on{color:var(--green)}
.tb{display:flex;flex-direction:column;gap:8px}
.tb .r{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;font-size:12.5px;font-weight:800}
.tb .r .b{height:10px;background:var(--alt);border-radius:999px;overflow:hidden}.tb .r .b i{display:block;height:100%}
.tb .r .v{font-weight:900;min-width:44px;text-align:right}
.post{padding:10px 0;border-bottom:1px solid var(--line)}.post:last-child{border-bottom:0}
.post .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;font-weight:800;color:var(--mute)}
.post .m .pl{padding:1px 7px;border-radius:4px;color:#fff;font-size:10.5px}
.post .m .ty{padding:1px 7px;border-radius:4px;background:var(--alt);color:var(--sub)}
.post .tx{font-size:13px;margin-top:4px;line-height:1.6}
.ins{margin-top:10px;font-size:12.5px;font-weight:700;background:var(--alt);padding:10px 12px;border-radius:8px;line-height:1.7}
/* survey */
.sv .r{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:12.5px;font-weight:800;padding:5px 0}
.sv .r .b{height:10px;background:var(--alt);border-radius:999px;overflow:hidden}.sv .r .b i{display:block;height:100%;background:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px}.tile .l{font-size:11.5px;font-weight:800;color:var(--sub)}.tile .v{font-size:22px;font-weight:900;margin-top:2px}.tile .v small{font-size:12px;color:var(--mute);margin-left:2px}.tile .c{font-size:11px;font-weight:700;color:var(--mute);margin-top:2px}
.tile .c.up{color:var(--green)}.tile .c.dn{color:var(--accent)}
.adv{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;font-size:13px;line-height:1.8}
.adv h4{font-size:13px;font-weight:900;margin:8px 0 2px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.note{font-size:11.5px;color:var(--mute);font-weight:700;margin-top:8px;line-height:1.7}
/* chart */
.ch svg{display:block;width:100%;height:auto}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;font-weight:800;color:var(--sub);margin-top:6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* fab + modal + drawer */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-size:14px;font-weight:900;box-shadow:0 10px 28px rgba(228,59,77,.35);display:flex;align-items:center;gap:8px}
.fab svg{width:16px;height:16px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
.ov{position:fixed;inset:0;background:rgba(15,21,30,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
@media(min-width:760px){.ov{align-items:center}}
.md{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:760px){.md{border-radius:14px;padding:22px}}
.md h3{font-size:17px;font-weight:900;margin-bottom:4px}
.md label{display:block;font-size:12px;font-weight:900;color:var(--sub);margin:14px 0 6px}
.md .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.md .x{position:absolute;right:14px;top:12px;border:0;background:none;font-size:24px;line-height:1;color:var(--mute)}
.md{position:relative}
.qr{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px}
.qr img{width:150px;height:150px;border:1px solid var(--line);border-radius:8px}
.url{font-size:12.5px;word-break:break-all;background:var(--alt);padding:8px 10px;border-radius:6px;font-weight:700}
.set .it{padding:14px 0;border-bottom:1px solid var(--line)}.set .it:last-child{border-bottom:0}
.set .it b{display:block;font-size:14px;font-weight:900}.set .it p{font-size:12.5px;color:var(--sub);font-weight:700;margin:2px 0 8px;line-height:1.7}
.hist{margin-top:10px}.hist .h{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.hist .h span{color:var(--mute);font-weight:700;white-space:nowrap}
.ok-msg{display:none;font-size:12.5px;font-weight:800;color:var(--green);margin-left:8px}.ok-msg.show{display:inline}
/* entry gate */
#gate{display:none;padding:60px 16px;text-align:center}
#gate h1{font-size:20px;font-weight:900;margin-bottom:8px}#gate p{color:var(--sub);font-weight:700;font-size:13.5px;margin-bottom:18px}
#gate .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--mute);font-weight:700}
</style>
</head>
<body>
<div id="bar" class="bar" style="display:none"></div>
<header class="hd"><div class="wrap">
  <div class="row">
    <a class="brand" href="/"><img src="/assets/logo-sm.webp?v=2" alt="チビスポ"><b>クラブ分析</b></a>
    <div class="club"><span class="nm" id="clubName">—</span><span class="plan" id="planBadge">—</span><button class="gear" id="gearBtn" aria-label="設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-t="now" aria-selected="true">いま<small>NOW</small></button>
    <button role="tab" data-t="acq" aria-selected="false">集客<small>WHERE FROM</small></button>
    <button role="tab" data-t="post" aria-selected="false">投稿<small>SNS</small></button>
  </nav>
</div></header>

<div id="gate" class="wrap"><h1 id="gTitle"></h1><p id="gSub"></p><div class="acts" id="gActs"></div></div>

<main class="wrap" id="main">
  <div class="pane on" id="pane-now">
    <section id="secMove"></section>
    <section><div class="sh"><div class="l"><div class="ey">THIS MONTH</div><h2>いまの数字</h2></div><span class="sub" id="kpiWin"></span></div><div class="grid g4" id="kpi"></div><div class="rev" id="rev" style="margin-top:10px"></div></section>
    <section><div class="sh"><div class="l"><div class="ey">6 MONTHS</div><h2>申込と入会の推移</h2></div><span class="sub">縦線＝やった施策（「＋記録」から）</span></div><div class="card ch" id="trend"></div></section>
  </div>
  <div class="pane" id="pane-acq">
    <section><div class="sh"><div class="l"><div class="ey">FUNNEL</div><h2>どの段階で、人が減っているか</h2></div><span class="sub" id="fnWin"></span></div><div class="card fn" id="funnel"></div></section>
    <section><div class="sh"><div class="l"><div class="ey">SOURCES</div><h2>どこから来ているか</h2></div><button class="btn s" id="addMediaBtn">＋ QR・計測リンクを作る</button></div><div id="sources"></div></section>
    <section><div class="sh"><div class="l"><div class="ey">SURVEY</div><h2>保護者アンケート</h2></div><span class="sub" id="svCount"></span></div><div class="card sv" id="survey"></div></section>
  </div>
  <div class="pane" id="pane-post">
    <section><div class="sh"><div class="l"><div class="ey">ACCOUNTS</div><h2>連携しているSNS</h2></div><span class="sub">毎朝6時に自動で取り込みます</span></div><div id="conn"></div></section>
    <section><div class="sh"><div class="l"><div class="ey">12 WEEKS</div><h2>投稿の量と、反応されているタイプ</h2></div></div><div class="grid g2"><div class="card ch" id="postWeekly"></div><div class="card" id="postTypes"></div></div></section>
    <section><div class="sh"><div class="l"><div class="ey">TOP POSTS</div><h2>当たり投稿と、その共通点</h2></div><div id="chSeg" class="tabs" style="max-width:100%"></div></div><div class="card" id="topPosts"></div></section>
    <section><div class="sh"><div class="l"><div class="ey">RECENT</div><h2>最近の投稿</h2></div></div><div class="card" id="recent"></div></section>
  </div>
</main>

<button class="fab" id="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>記録</button>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<script>
/* ============ 設定・共通 ============ */

  if(!posts.length){$('#recent').innerHTML='<div class="empty">'+(CH==='all'?'SNSを連携すると、投稿が毎日ここに入ります':'この媒体の投稿はまだ取り込まれていません')+'</div>';return;}
  var shown=__recentOpen?posts.slice(0,30):posts.slice(0,6);
  $('#recent').innerHTML=shown.map(function(p){return '<div class="post"><div class="m"><span class="pl" style="background:'+(PLAT_COLOR[p.platform]||'#999')+'">'+(PLAT[p.platform]||esc(p.platform))+'</span>'+(p.post_type?'<span class="ty">'+esc(p.post_type)+'</span>':'')+'<span>'+fmtDate(p.posted_at)+'</span>'+((p.like_count!=null||p.comments_count!=null)?'<span>♥ '+(p.like_count||0)+'　💬 '+(p.comments_count||0)+'</span>':'')+(p.permalink&&p.permalink!=='#'?'<a class="link" href="'+esc(p.permalink)+'" target="_blank" rel="noopener">見る↗</a>':'')+'</div><div class="tx">'+esc(String(p.text||'').replace(/\s+/g,' ').slice(0,100))+'</div></div>';}).join('')
    +(posts.length>6?'<div style="margin-top:10px"><button class="btn s o" id="recMore">'+(__recentOpen?'閉じる':'もっと見る（全'+posts.length+'件）')+'</button></div>':'');
  var b=$('#recMore');if(b)b.onclick=function(){__recentOpen=!__recentOpen;renderRecent();};
}
function renderSeg(){
  var plats=Array.from(new Set(((D&&D.posts)||[]).map(function(p){return p.platform;}).concat(((D&&D.post_stats)||[]).map(function(s){return s.platform;}))));
  if(!isPro()||plats.length<2){$('#chSeg').innerHTML='';return;}
  $('#chSeg').innerHTML=['all'].concat(plats).map(function(p){return '<button data-ch="'+p+'" aria-selected="'+(CH===p)+'" style="min-width:70px;padding:6px 8px 5px;font-size:12px">'+(p==='all'?'全体':(PLAT[p]||p))+'</button>';}).join('');
  $('#chSeg').querySelectorAll('button').forEach(function(b){b.onclick=function(){CH=b.dataset.ch;renderSeg();renderPostWeekly();renderPostTypes();renderTop();renderRecent();};});
}
function renderAll(){renderMove();renderKPI();renderTrend();renderFunnel();renderSources();renderSurvey();renderSeg();renderPostWeekly();renderPostTypes();renderTop();renderRecent();}

<script>
/* ============ 操作：タブ・モーダル・記録・設定 ============ */
function showTab(t){document.querySelectorAll('.tabs[role=tablist] button').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.t===t));});document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.id==='pane-'+t);});history.replaceState(null,'','#'+t);window.scrollTo({top:0});}

function openModal(html){$('#md').innerHTML='<button class="x" id="mdX" aria-label="閉じる">×</button>'+html;$('#ov').classList.add('on');$('#mdX').onclick=closeModal;}
function closeModal(){$('#ov').classList.remove('on');}
$('#ov').addEventListener('click',function(e){if(e.target===this)closeModal();});
function toast(msg){var b=$('#bar');b.className='bar ok';b.style.display='';b.textContent=msg;clearTimeout(toast._t);toast._t=setTimeout(function(){setBar();},2600);}
function setBar(msg,cls){var b=$('#bar');if(!msg){if(DEMO){b.className='bar demo';b.style.display='';b.textContent='サンプル表示：架空クラブ「サンプルFC」の数字です。契約後はあなたのクラブの実データが自動で入ります。';}else b.style.display='none';return;}b.className='bar '+(cls||'warn');b.style.display='';b.textContent=msg;}
function copyText(t){if(!t)return;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('コピーしました');}).catch(function(){prompt('コピーしてください',t);});}
function qrSrc(url){return 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=8&data='+encodeURIComponent(url);}
function showQR(title,url){openModal('<h3>'+esc(title)+'</h3><p class="sub">QRを印刷物に載せる、URLをSNSのプロフィールに貼る、のどちらでも数えられます。</p><div class="qr"><img src="'+qrSrc(url)+'" alt="QR"><div style="flex:1;min-width:200px"><div class="url">'+esc(url)+'</div><div class="acts" style="margin-top:10px"><button class="btn s" id="qrCopy">URLをコピー</button><a class="btn s o" href="'+qrSrc(url)+'" download="qr.png" target="_blank" rel="noopener">QR画像を開く</a></div></div></div>');$('#qrCopy').onclick=function(){copyText(url);};}

function openRecord(kind){
  var today=isoDate(new Date());

    +'<label>何があった</label><select id="rKind"><optgroup label="出来事"><option>体験・見学の申込</option><option>体験・見学に参加</option><option>入会が決まった</option><option>退会</option><option>電話の問い合わせ</option><option>LINEの問い合わせ</option></optgroup><optgroup label="施策（推移のグラフに縦線が立ちます）"><option>🪧 ポスターを掲示した</option><option>📄 チラシを配った</option><option>⚽ 体験会・イベントをやった</option><option>✏️ その他の施策</option></optgroup></select>'
    +'<div id="rRouteW"><label>きっかけ（わかれば）</label><select id="rRoute"><option>不明・聞いていない</option><option>電話（チラシを見て）</option><option>電話（ポスターを見て）</option><option>知人の紹介</option><option>Instagramを見て</option><option>チビスポを見て</option><option>その場で（見学中に）</option></select></div>'
    +'<div id="rNumW"><label>人数</label><input type="number" id="rNum" min="1" value="1" inputmode="numeric"></div>'
    +'<label>メモ（任意）</label><input id="rMemo" placeholder="例：小2の男の子。土曜の体験希望／駅前掲示板に掲示">'
    +'<div class="acts"><button class="btn a" id="rSave">記録する</button><button class="btn o" id="rCancel">閉じる</button></div>'

}
function renderHist(){var el=$('#rHist');if(!el)return;var recs=recList().slice().reverse().slice(0,8);el.innerHTML=recs.length?'<div class="hint" style="margin-bottom:4px">最近の記録</div>'+recs.map(function(r){return '<div class="h"><span>'+esc(r.d)+'</span><b style="flex:1">'+esc(r.k)+(r.n?' '+r.n+'人':'')+(r.m?'<span class="hint"> '+esc(r.m)+'</span>':'')+'</b></div>';}).join(''):'';}
function saveRecord(){
  var date=$('#rDate').value,kind=$('#rKind').value,pol=isPolicy(kind),num=pol?0:parseInt($('#rNum').value||'1',10),memo=$('#rMemo').value.trim();
  if(!date){alert('日付を入れてください');return;} if(!pol&&(isNaN(num)||num<1)){alert('人数は1以上で入力してください');return;}
  var recs=recList();recs.push({d:date,k:kind,r:(pol||kind==='退会')?'':$('#rRoute').value,n:num,m:memo});localStorage.setItem(hk('records'),JSON.stringify(recs));
  var mon=date.slice(0,7);
  if(kind==='体験・見学の申込')setNum('trial_manual',getNum('trial_manual',0)+num);
  else if(kind==='体験・見学に参加')setNum('attend',getNum('attend',0)+num);
  else if(kind==='入会が決まった'){var jm=joinsData();jm[mon]=(+jm[mon]||0)+num;localStorage.setItem(hk('joins_m'),JSON.stringify(jm));setNum('members',getNum('members',0)+num);}
  else if(kind==='退会')setNum('members',Math.max(0,getNum('members',0)-num));

}

  $('#eCancel').onclick=closeModal;$('#eSave').onclick=function(){var v=parseInt($('#eNum').value,10);if(isNaN(v)||v<0){alert('0以上の数字を入力してください');return;}setNum(k,v);manualPush();renderAll();closeModal();toast('保存しました');};
}
document.addEventListener('click',function(e){

  var ed=e.target.closest('[data-edit]');if(ed){editNum(ed.dataset.edit);return;}
  var q=e.target.closest('[data-qr]');if(q){showQR(q.dataset.nm,goUrl(q.dataset.qr));return;}

});

var KINDS=[['poster','ポスター','掲示場所ごとに分けると効果を比べられます'],['flyer','チラシ','配布のタイミングごとに分けるのがおすすめ'],['sns','SNS','プロフィールのリンクに貼り替えるだけ'],['referral','紹介カード','保護者に渡す口コミ計測用'],['web','自クラブHP','リンクを貼り替えるだけ'],['other','その他','看板・地域誌・イベントなど']];

  openModal('<h3>QR・計測リンクを作る</h3><p class="sub">媒体ごとに専用のリンクとQRを発行します。そこから来た人数が自動で数えられ、「どこから来ているか」に並びます。</p>'

/* ---- AI・SNS・アンケート ---- */
function genReport(btn){if(DEMO)return;if(!token()){alert('ログインが必要です');return;}btn.disabled=true;btn.textContent='生成中…';
  var manual=manualCollect(),tc={};((D&&D.posts)||[]).forEach(function(p){var t=p.post_type||'未分類';tc[t]=(tc[t]||0)+1;});
  var days=(D.analytics&&D.analytics.range&&D.analytics.range.lookback_days)||30, jm=manual.joins_m||{}, jt=Object.keys(jm).reduce(function(s,k){return s+(+jm[k]||0);},0);
  var tf=(D.trials&&+D.trials.total)||0;
  var summary={'集計期間':days+'日間','クラブページの閲覧数':(D.analytics&&D.analytics.club&&+D.analytics.club.views)||0,'SNSで表示された回数':(D.post_stats||[]).reduce(function(s,r){return s+(+r.total_views||0);},0),'SNS投稿数_タイプ別':tc,
    '計測リンク経由のクリック数_媒体別':((D.clicks&&D.clicks.channels)||[]).map(function(c){return chName(c)+'：'+(+c.clicks||0)+'クリック';}),
    '体験申込の件数':{'合計':tf+(manual.trial_manual||0),'クラブページのフォーム経由（自動計測）':tf,'電話・紙など（手動で記録した分）':manual.trial_manual||0},'体験に実際に参加した人数':manual.attend||0,'入会した人数':{'合計':jt,'月別':jm},'現在の会員数':manual.members||0,'会員数の目標':manual.goal||40,
    '保護者アンケート':(D.survey&&D.survey.result)?{'回答数':D.survey.total,'どこでクラブを知ったか（回答者の内訳）':D.survey.result.counts||{},'満足度':Object.keys(D.survey.result.numeric||{}).map(function(k){var m=D.survey.result.numeric[k];return typeof m.nps==='number'?k+'：おすすめ度(NPS)＝'+m.nps+'（0〜10点で平均'+m.avg+'点・回答'+m.n+'件）':k+'：平均'+m.avg+'点（'+(m.max<=5?5:m.max)+'点満点・回答'+m.n+'件）';})}:'まだアンケートを配布していない（または回答0件）',
    '実施済みの施策（すでに記録・設定タブに登録済み）':recList().filter(function(r){return isPolicy(r.k);}).map(function(r){return r.d+' '+(r.m||r.k);}).slice(-10)};
  api('/api/home/report',{summary:summary}).then(function(j){if(j&&j.ok&&j.report){var pq=(D.ai_report&&D.ai_report.quota)||{used:0,limit:3};D.ai_report={report:j.report,at:j.at||new Date().toISOString(),quota:{used:(j.used!=null?j.used:pq.used),limit:j.limit||pq.limit||3}};renderMove();
      if(j.unchanged)toast('前回からデータに変化がないため、保存済みの提案を表示しています');else if(j.limit_reached)toast('本日の生成上限に達しました。保存済みの提案を表示しています');else if(j.cached)toast('さきほど生成した提案です（更新は約'+Math.ceil((j.wait||600)/60)+'分後から）');}
    else{btn.disabled=false;btn.textContent='AIに提案してもらう';alert('生成に失敗しました：'+((j&&(j.detail||j.error))||'不明'));}}).catch(function(){btn.disabled=false;alert('生成に失敗しました（通信エラー）');});
}
function connectSns(p){if(DEMO)return;if(!token()){alert('ログインが必要です');return;}
  if(p==='youtube'){var ch=prompt('YouTubeチャンネルのURL（または @ハンドル）を入力してください。\n例：https://www.youtube.com/@yourchannel');if(!ch)return;api('/auth/youtube/connect',{channel:ch}).then(function(j){if(j&&j.ok){alert('YouTube「'+j.name+'」を連携しました。動画データは毎日自動で取り込まれます。');location.reload();}else if(j&&j.error==='channel_not_found')alert('チャンネルが見つかりませんでした。URLか@ハンドルをご確認ください。');else alert('連携に失敗しました。もう一度お試しください。');}).catch(function(){alert('連携に失敗しました（通信エラー）');});return;}
  api('/auth/'+p+'/start',{}).then(function(j){if(!j||!j.auth_url){alert('連携を開始できませんでした。ログイン状態を確認して、もう一度お試しください。');return;}location.assign(j.auth_url);}).catch(function(){alert('連携を開始できませんでした（通信エラー）');});
}
function surveyProvision(){if(!token()){alert('ログインが必要です');return;}if(!confirm('このクラブ専用の保護者アンケート（Googleフォーム）を作成します。よろしいですか？'))return;openModal('<div style="text-align:center;padding:24px 8px"><b>アンケートを作成しています…</b><br><span class="hint">10秒ほどかかります</span></div>');
  api('/api/survey/provision',{}).then(function(j){closeModal();if(j&&j.ok){alert('アンケートを作成しました。QR・URLが使えるようになりました。');location.reload();}else if(j&&j.error==='not_configured')alert('サーバー側のアンケート設定が未完了です。');else alert('作成に失敗しました：'+((j&&(j.detail||j.error))||'不明'));}).catch(function(){closeModal();alert('作成に失敗しました（通信エラー）');});}
function surveyRefresh(btn){if(!token()){alert('ログインが必要です');return;}btn.disabled=true;btn.textContent='取り込み中…';api('/api/survey/refresh',{}).then(function(j){if(j&&j.ok){alert(j.no_column?'読み込めましたが「どこで知ったか」の項目が見つかりませんでした。':'回答 '+j.total+'件を取り込みました。');location.reload();}else{btn.disabled=false;btn.textContent='最新の回答を取り込む';alert(j&&j.error==='daily_limit'?'本日の取り込み上限に達しました。明朝6時の自動更新をお待ちください。':j&&j.error==='too_soon'?'さきほど取り込んだばかりです。少し待ってからお試しください。':'取り込みに失敗しました：'+((j&&(j.detail||j.error))||'不明'));}}).catch(function(){btn.disabled=false;alert('取り込みに失敗しました（通信エラー）');});}
function surveyAdvice(){if(!token()){alert('ログインが必要です');return;}var body=$('#svAdvBody');body.innerHTML='<span class="hint">AIが分析しています…（10秒ほど）</span>';
  api('/api/survey/advice',{}).then(function(j){if(j&&j.ok){body.innerHTML=advHtml(j.advice||'');if(j.unchanged)toast('前回から回答に変化がないため、保存済みの結果です');else if(j.limit_reached)toast('本日の生成上限に達しました');}else if(j&&j.error==='no_data')body.innerHTML='<span class="hint">まだ回答がありません。集まってから生成できます。</span>';else body.innerHTML='<span style="color:var(--accent)">生成に失敗しました：'+esc((j&&(j.detail||j.error))||'不明')+'</span>';}).catch(function(){body.innerHTML='<span style="color:var(--accent)">生成に失敗しました（通信エラー）</span>';});}

function gate(title,sub,acts){document.querySelectorAll('header.hd, main, .fab').forEach(function(el){el.style.display='none';});var g=$('#gate');g.style.display='block';$('#gTitle').textContent=title;$('#gSub').textContent=sub;$('#gActs').innerHTML=acts;}

function boot(){
  var h=location.hash.replace('#','');if(['now','acq','post'].indexOf(h)>=0)showTab(h);
  if(DEMO){D=demoData();manualApply(D.manual);$('#clubName').textContent=D.club.name;$('#planBadge').textContent='PRO';$('#planBadge').className='plan pro';setBar();renderAll();renderConn({instagram:true,threads:true});return;}
  if(!CLUB){
    var uid=null;try{var tk=token();if(tk)uid=JSON.parse(atob(tk.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub||null;}catch(e){}
    if(!uid){gate('ログインすると、あなたのクラブの数字が表示されます','クラブアカウントでログインしてから、もう一度開いてください。中身だけ先に見たい場合はサンプルをどうぞ。',btnA('クラブログイン','/club-mypage.html',true)+btnA('サンプルを見る','?demo=1'));return;}
    fetch(SB_URL+'/rest/v1/teams?select=id,name&user_id=eq.'+encodeURIComponent(uid)+'&order=created_at.asc',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}}).then(function(r){return r.json();}).then(function(rows){
      if(Array.isArray(rows)&&rows.length===1){location.replace('?club='+encodeURIComponent(rows[0].id));return;}
      if(Array.isArray(rows)&&rows.length>1){gate('どのクラブの数字を見ますか？','',rows.map(function(x){return btnA(x.name,'?club='+encodeURIComponent(x.id),true);}).join(''));return;}
      gate('このアカウントには、まだクラブが登録されていません','クラブを登録すると、掲載ページの閲覧数や申込の推移がここに出ます。',btnA('クラブを登録する','/register.html',true)+btnA('サンプルを見る','?demo=1'));
    }).catch(function(){gate('クラブを読み込めませんでした','通信環境をご確認のうえ、もう一度お試しください。',btnA('マイページへ','/club-mypage.html',true));});
    return;
  }
  setBar('読み込んでいます…','ok');
  authFetch(API+'/api/dashboard?club='+encodeURIComponent(CLUB)).then(function(r){
    if(!r){gate('ログインが切れています','クラブアカウントでログインし直してから、もう一度開いてください。',btnA('クラブログイン','/club-mypage.html',true));return;}
    if(r.status===402){gate('クラブ分析は、プロプランの機能です','閲覧数・体験申込・入会、QRやSNSからの流入、保護者アンケートが1つの画面にまとまります。',btnA('プロプランを見る','/plans.html#pro',true)+btnA('マイページへ','/club-mypage.html'));return;}
    if(r.status===401||r.status===403){gate('このクラブの数字は表示できません','ログイン中のアカウントがこのクラブの担当者ではないか、ログインが切れています。',btnA('マイページへ','/club-mypage.html',true));return;}
    return r.json().then(function(d){
      if(!d||!d.ok){gate('読み込みに失敗しました','時間をおいて、もう一度お試しください。',btnA('マイページへ','/club-mypage.html',true));return;}
      D=d; if(d.manual)manualApply(d.manual); else if(recList().length||getNum('members',0))manualPush();
      document.title=d.club.name+'のクラブ分析｜チビスポ';$('#clubName').textContent=d.club.name;
      var pm={free:'FREE',pr:'STANDARD','pr-plus':'PRO'};$('#planBadge').textContent=pm[d.club.plan]||'PLAN';$('#planBadge').className='plan'+(d.club.pro?' pro':'');
      setBar(); renderAll();
      if(isPro()){var conn={};(d.post_stats||[]).concat(d.posts||[]).forEach(function(x){conn[String(x.platform).toLowerCase()]=true;});renderConn(conn);
        authFetch(API+'/api/sns-status?club='+encodeURIComponent(CLUB)).then(function(r2){return r2&&r2.ok?r2.json():null;}).then(function(s){if(!s||!s.ok)return;['instagram','threads','youtube'].forEach(function(k){if(s[k])conn[k]=true;});renderConn(conn);}).catch(function(){});
      } else renderConn({});
      var qs=new URLSearchParams(location.search);if(qs.get('ig')==='connected'||qs.get('threads')==='connected')toast('SNSを連携しました。投稿は明朝6時から自動で取り込まれます');
    });
  }).catch(function(){gate('読み込みに失敗しました','通信環境をご確認のうえ、もう一度お試しください。',btnA('マイページへ','/club-mypage.html',true));});
}
boot();
</script>
