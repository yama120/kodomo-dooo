  <style>
    /* アプリのオンボーディング画面に合わせたロゴ・配色（マスコットの色と揃える） */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --primary: #2270e0; --brand: #f0435c; --bg: #f5f7f9; --text: #1f2430; --muted: #8a93a0; --border: #e6e9ed; --radius: 18px; --shadow: 0 4px 18px rgba(20,28,38,.06); }
    body { font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 30px 26px 26px; width: 100%; max-width: 400px; }
    /* アプリの初回登録画面（オンボーディング）と同じマスコット＋ロゴタイプ */
    .brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 18px; }
    .brand svg { width: 56px; height: 56px; }
    .brand span { font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 22px; color: var(--brand); margin-top: 6px; letter-spacing: .02em; }
    h1 { font-size: 1rem; font-weight: 800; text-align: center; margin-bottom: 6px; }
    p { font-size: .88rem; color: var(--muted); margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label { display: block; font-size: 12.5px; font-weight: 700; color: #3a4452; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px 13px; border: 1px solid var(--border); border-radius: 9px; font-size: .95rem; font-family: inherit; outline: none; transition: border-color .15s; }
    .form-group input:focus { border-color: var(--primary); }
    .btn { width: 100%; padding: 14px 0; background: var(--brand); color: #fff; border: none; border-radius: 10px; font-size: .95rem; font-weight: 800; font-family: inherit; cursor: pointer; transition: opacity .15s; }
    .btn:hover { opacity: .9; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .alert { padding: 12px 16px; border-radius: 10px; font-size: .88rem; margin-bottom: 16px; text-align: left; }
    .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }

<body>
<div class="card">
  <div class="brand" role="img" aria-label="チビスポ">
    <svg viewBox="0 0 88 92" fill="none" aria-hidden="true">
      <path fill="#EF5D71" d="M10.5 66.8C5.3 53 8.3 39.8 16.3 29.8C23.4 20.8 34 15.8 45.2 16.1C47.8 12.9 50.7 9.8 54.8 7.4C54.5 11.4 53.8 14.7 52.5 17.8C59.1 16.2 66 16 72.6 17C69.8 21.1 67 24.4 63.6 27.4C69 27 74.1 27.1 79.2 27.9C75.5 32.7 71.7 36.6 67.3 40.4C70.9 46 72.5 52.7 71.5 59C70.8 63.3 69.1 67.3 66.4 70.8C60.6 78.4 50.8 82.8 39.7 82.8C28.1 82.8 17 77.8 10.5 66.8Z" />
      <path fill="#FFFFFF" d="M42.2 77.4C37.4 77.6 32.7 77.2 28.3 75.7C23.2 74 18.8 70.8 15.8 66.3C13.3 62.5 12.4 57.7 13.0 52.7C13.7 46.8 16.3 41.6 20.5 38.2C24.2 35.3 28.7 34.3 33.1 35.4C35.2 36.0 36.9 37.1 38.3 38.8C39.5 37.0 41.2 35.7 43.1 35.1C47.3 33.7 51.9 34.5 56.0 37.2C60.8 40.4 64.0 45.9 64.6 52.4C65.1 57.6 64.1 62.8 61.4 66.7C58.2 71.2 53.4 74.3 47.9 75.9C46.0 76.5 44.1 77.0 42.2 77.4Z" />
      <ellipse cx="28.8" cy="54.5" rx="3.2" ry="4.3" fill="#2F3340" />
      <ellipse cx="46.5" cy="54.5" rx="3.2" ry="4.3" fill="#2F3340" />
      <circle cx="20.7" cy="61.8" r="2.2" fill="#F8CDD3" />
      <circle cx="54.3" cy="61.8" r="2.2" fill="#F8CDD3" />

        fill="none" stroke="#2F3340" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span>チビスポ</span>
  </div>
  <h1>パスワード再設定</h1>
  <p id="lead">新しいパスワードを入力してください。</p>
  <div id="msg" class="alert" style="display:none;"></div>

  <!-- 再設定リンクを経由せずに来た場合。ここから再設定メールを送る -->
  <div id="requestArea" style="display:none;">
    <div class="form-group">
      <label>登録しているメールアドレス</label>
      <input type="email" id="resetEmail" placeholder="you@example.com" />
    </div>
    <button class="btn" id="sendBtn" onclick="sendResetMail()">再設定メールを送る</button>
  </div>

  <div id="formArea" style="display:none;">
    <div class="form-group">
      <label>新しいパスワード</label>
      <input type="password" id="newPassword" placeholder="8文字以上" />
    </div>
    <div class="form-group">
      <label>パスワード確認</label>
      <input type="password" id="confirmPassword" placeholder="もう一度入力" />
    </div>
    <button class="btn" id="submitBtn" onclick="updatePassword()">パスワードを変更する</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://emkpkomrgknzrmxqbrvx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVta3Brb21yZ2tuenJteHFicnZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5Nzg0MTYsImV4cCI6MjA5MjU1NDQxNn0.YmtVc_0le-EDjGzv1PJHet0ShnhfFZLIYT587FzcJHQ';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

/* メールのリンク（#access_token付き）で来たかどうかで表示を切り替える。
   以前は常にパスワード入力欄を出していたため、リンク無しで来た人は
   入力しても必ず失敗し、再設定する手段が無かった */
(function init() {
  const hasToken = /access_token=/.test(location.hash || '');
  document.getElementById('formArea').style.display = hasToken ? '' : 'none';
  document.getElementById('requestArea').style.display = hasToken ? 'none' : '';
  document.getElementById('lead').textContent = hasToken
    ? '新しいパスワードを入力してください。'
    : '登録しているメールアドレスに、再設定用のリンクをお送りします。';
})();

async function sendResetMail() {
  const email = document.getElementById('resetEmail').value.trim();
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('sendBtn');
  msgEl.style.display = 'none';
  if (!/\S+@\S+\.\S+/.test(email)) {
    msgEl.textContent = 'メールアドレスの形式が正しくありません。';
    msgEl.className = 'alert alert-error'; msgEl.style.display = 'block';
    return;
  }
  btn.disabled = true; btn.textContent = '送信中...';
  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://chibispo.com/reset-password.html',
  });
  // 存在しないアドレスでも成否を明かさない（アカウントの有無が分かってしまうため）
  msgEl.textContent = error && /rate|limit/i.test(error.message || '')
    ? '送信回数の上限に達しました。しばらく待ってからお試しください。'
    : 'メールをお送りしました。届いたリンクから再設定してください。';
  msgEl.className = error && /rate|limit/i.test(error.message || '') ? 'alert alert-error' : 'alert alert-success';
  msgEl.style.display = 'block';
  btn.disabled = false; btn.textContent = '再設定メールを送る';
}

async function updatePassword() {
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  msgEl.style.display = 'none';

  if (newPassword.length < 8) {
    msgEl.textContent = 'パスワードは8文字以上で入力してください。';
    msgEl.className = 'alert alert-error';
    msgEl.style.display = 'block';
    return;
  }
  if (newPassword !== confirmPassword) {
    msgEl.textContent = 'パスワードが一致しません。';
    msgEl.className = 'alert alert-error';
    msgEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = '変更中...';

  const { error } = await db.auth.updateUser({ password: newPassword });
  if (error) {
    msgEl.textContent = '変更に失敗しました。リンクの有効期限が切れている可能性があります。';
    msgEl.className = 'alert alert-error';
    msgEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'パスワードを変更する';
  } else {
    msgEl.textContent = 'パスワードを変更しました。マイページからログインしてください。';
    msgEl.className = 'alert alert-success';
    msgEl.style.display = 'block';
    document.getElementById('formArea').style.display = 'none';
    setTimeout(() => { location.href = 'mypage.html'; }, 3000);
  }
}
</script>
</body>
